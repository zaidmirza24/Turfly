name: CI

# The 177 backend + frontend tests in this repo previously only ran when
# someone remembered to run them locally — nothing enforced it. This is the
# minimum bar: every push and PR runs the existing test suites and a
# frontend typecheck, so a regression is caught before merge instead of in
# production.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend tests + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
